<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازی حدس گیفت تیک‌تاک</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:18px 10px;
  text-align:center;
  font-family:Arial,sans-serif;
  color:white;
  background:linear-gradient(135deg,#17152e,#33204c);
}
h1{color:#ffdf55;font-size:24px}
#board{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  max-width:520px;
  margin:20px auto;
}
.card{
  min-height:115px;
  border:2px solid #ffdf55;
  border-radius:14px;
  background:#49356c;
  color:white;
  padding:7px 3px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  overflow:hidden;
}
.card:disabled{opacity:1}
.number{font-size:28px;font-weight:bold}
.gift-img{width:62px;height:62px;object-fit:contain}
.gift-name{font-size:12px;font-weight:bold}
.price{font-size:12px;color:#ffe56d}
#message{min-height:28px;color:#ffe56d}
#restart{
  background:#ffdf55;
  color:#241638;
  border:0;
  padding:13px 24px;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
}
@media(max-width:360px){
  #board{gap:5px}
  .gift-img{width:48px;height:48px}
  .card{min-height:100px}
}
</style>
</head>

<body>
<h1>🎁 بازی حدس گیفت تیک‌تاک 🎁</h1>
<p>یک شماره انتخاب کن و گیفت پنهان‌شده را پیدا کن!</p>
<p>۲۰ شماره، از گیفت‌های کوچک تا گیفت‌های بزرگ</p>

<div id="board"></div>
<div id="message">در حال آماده‌کردن گیفت‌ها...</div>
<button id="restart" onclick="startGame()">🔄 شروع دوباره</button>

<script>
const gifts=[
 {name:"Rose",price:1},
 {name:"Finger Heart",price:5},
 {name:"Ice Cream Cone",price:1},
 {name:"Perfume",price:20},
 {name:"Love You",price:49},
 {name:"Teddy Bear",price:100},
 {name:"Mic",price:100},
 {name:"Hand Hearts",price:100},
 {name:"Sunglasses",price:199},
 {name:"Bouquet",price:500},
 {name:"Galaxy",price:1000},
 {name:"Fireworks",price:1088},
 {name:"Whale Diving",price:2150},
 {name:"Private Jet",price:4888},
 {name:"Sports Car",price:7000},
 {name:"Castle",price:20000},
 {name:"Lion",price:29999},
 {name:"Dragon",price:39999},
 {name:"Tiger",price:19999},
 {name:"TikTok Universe",price:44999}
];

const dataURL=
"https://raw.githubusercontent.com/antiops/tiktok-trending-data/main/live-gift-details.json";

let imageMap={};

async function loadImages(){
 try{
  const response=await fetch(dataURL);
  if(!response.ok) throw new Error("Images unavailable");
  const data=await response.json();

  data.forEach(item=>{
   if(item.name && item.image && item.image.url_list){
    imageMap[item.name.toLowerCase().trim()]=
      item.image.url_list[0];
   }
  });

  document.getElementById("message").textContent=
    "گیفت‌ها آماده‌اند؛ یک شماره انتخاب کن!";
 }catch(error){
  document.getElementById("message").textContent=
    "عکس‌ها بارگذاری نشدند؛ اینترنت را بررسی کن.";
 }
}

function findImage(name){
 const key=name.toLowerCase().trim();

 if(imageMap[key]) return imageMap[key];

 const aliases={
  "love you":["love you so much","love you"],
  "teddy bear":["teddy bear"],
  "hand hearts":["hand hearts","hand heart"],
  "sunglasses":["sunglasses","2025 glasses"],
  "bouquet":["bouquet"],
  "fireworks":["fireworks","fireworks show"],
  "private jet":["private jet"],
  "sports car":["sports car"],
  "castle":["castle"],
  "dragon":["dragon"],
  "tiger":["tiger"],
  "galaxy":["galaxy"],
  "whale diving":["whale diving","whale"],
  "mic":["gimme the mic","take the mic","mic"]
 };

 const options=aliases[key]||[key];

 for(const option of options){
  if(imageMap[option]) return imageMap[option];
 }

 const match=Object.keys(imageMap).find(k=>
  k===key || k.startsWith(key+" ")
 );

 return match ? imageMap[match] : "";
}

function startGame(){
 const board=document.getElementById("board");
 board.innerHTML="";

 const shuffled=[...gifts].sort(()=>Math.random()-0.5);

 shuffled.forEach((gift,index)=>{
  const card=document.createElement("button");
  card.className="card";
  card.innerHTML='<span class="number">'+(index+1)+'</span>';

  card.onclick=()=>{
   if(card.disabled)return;
   card.disabled=true;
   card.innerHTML="";

   const image=findImage(gift.name);

   if(image){
    const img=document.createElement("img");
    img.className="gift-img";
    img.src=image;
    img.alt=gift.name;
    img.onerror=()=>img.remove();
    card.appendChild(img);
   }

   const name=document.createElement("span");
   name.className="gift-name";
   name.textContent=gift.name;

   const price=document.createElement("span");
   price.className="price";
   price.textContent=
     gift.price.toLocaleString("en-US")+" سکه";

   card.append(name,price);

   document.getElementById("message").textContent=
     "گیفت پیدا شد: "+gift.name+" 🎉";
  };

  board.appendChild(card);
 });
}

startGame();
loadImages();
</script>
</body>
</html>
