<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازی حدس گیفت تیک‌تاک</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  text-align:center;
  background:linear-gradient(135deg,#17152e,#33204c);
  color:white;
  padding:20px 12px;
}
h1{font-size:25px;color:#ffdf55}
p{color:#eee}
#board{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  max-width:520px;
  margin:22px auto;
}
.card{
  min-height:120px;
  border:2px solid #ffdf55;
  border-radius:14px;
  background:#49356c;
  color:white;
  padding:8px 3px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  overflow:hidden;
}
.card:disabled{cursor:default}
.number{font-size:28px;font-weight:bold}
.gift-img{
  width:62px;
  height:62px;
  object-fit:contain;
}
.gift-name{font-size:13px;font-weight:bold}
.price{font-size:12px;color:#ffe56d}
button#restart{
  background:#ffdf55;
  color:#241638;
  border:0;
  padding:13px 25px;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}
#message{min-height:28px;color:#ffe56d}
@media(max-width:360px){
  #board{gap:6px}
  .card{min-height:105px}
  .gift-img{width:48px;height:48px}
}
</style>
</head>
<body>

<h1>🎁 بازی حدس گیفت تیک‌تاک 🎁</h1>
<p>یک شماره انتخاب کن و ببین چه گیفتی پشت آن پنهان شده!</p>
<p>۲۰ شماره، ۲۰ گیفت معروف</p>

<div id="board"></div>
<div id="message">روی یکی از شماره‌ها بزن!</div>
<button id="restart" onclick="startGame()">🔄 شروع دوباره</button>

<script>
const gifts = [
  {name:"Rose",price:1,image:"rose.webp"},
  {name:"Finger Heart",price:5,image:"finger_heart.webp"},
  {name:"Ice Cream",price:10,image:"ice_cream.webp"},
  {name:"Perfume",price:20,image:"perfume.webp"},
  {name:"Love You",price:49,image:"love_you.webp"},
  {name:"Teddy Bear",price:100,image:"teddy_bear.webp"},
  {name:"Mic",price:100,image:"mic.webp"},
  {name:"Hand Hearts",price:100,image:"hand_hearts.webp"},
  {name:"Sunglasses",price:199,image:"sunglasses.webp"},
  {name:"Bouquet",price:199,image:"bouquet.webp"},
  {name:"Galaxy",price:1000,image:"galaxy.webp"},
  {name:"Fireworks",price:1088,image:"fireworks.webp"},
  {name:"Whale",price:2150,image:"whale.webp"},
  {name:"Private Jet",price:4888,image:"private_jet.webp"},
  {name:"Sports Car",price:7000,image:"sports_car.webp"},
  {name:"Castle",price:20000,image:"castle.webp"},
  {name:"Lion",price:29999,image:"lion.webp"},
  {name:"Dragon",price:planPrice("dragon"),image:"dragon.webp"},
  {name:"Tiger",price:39999,image:"tiger.webp"},
  {name:"TikTok Universe",price:44999,image:"tiktok_universe.webp"}
];

function planPrice(name){
  return 39999;
}

const imageBase = "https://beetgames.com/images/gifts/";

function startGame(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  document.getElementById("message").textContent =
    "روی یکی از شماره‌ها بزن!";
  
  const shuffled = [...gifts].sort(() => Math.random() - 0.5);

  shuffled.forEach((gift,index)=>{
    const card = document.createElement("button");
    card.className = "card";
    card.innerHTML = `<span class="number">${index+1}</span>`;

    card.onclick = ()=>{
      if(card.disabled) return;
      card.disabled = true;
      card.innerHTML = "";

      const img = document.createElement("img");
      img.className = "gift-img";
      img.src = imageBase + gift.image;
      img.alt = gift.name;

      img.onerror = ()=>{
        img.onerror = null;
        img.src = "https://beetgames.com/images/gifts/rose.webp";
      };

      const name = document.createElement("span");
      name.className = "gift-name";
      name.textContent = gift.name;

      const price = document.createElement("span");
      price.className = "price";
      price.textContent = gift.price.toLocaleString("en-US") + " سکه";

      card.append(img,name,price);
      document.getElementById("message").textContent =
        "گیفت پیدا شد: " + gift.name + " 🎉";
    };

    board.appendChild(card);
  });
}

startGame();
</script>
</body>
</html>
